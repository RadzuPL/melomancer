<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="head-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect x="0.75" y="0.75" width="1198.5" height="698.5" rx="16" fill="#ffffff" stroke="#cfcbdb" stroke-width="1.5"/><rect x="30" y="70" width="210" height="380" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="135" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">Przeglądarka</text><rect x="45" y="110" width="180" height="70" rx="10" fill="#e8f1fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="135.0" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Panel</text><text x="135.0" y="163" text-anchor="middle" font-size="12.5" fill="#6c6779">czysty JavaScript, PL / EN</text><rect x="45" y="330" width="180" height="80" rx="10" fill="#e8f1fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="135.0" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">LocalPlayer</text><text x="135.0" y="388" text-anchor="middle" font-size="12.5" fill="#6c6779">Web Audio, „Odtwarzaj tutaj”</text><text x="135" y="435" text-anchor="middle" font-size="12" font-weight="400" fill="#6c6779">głośniki tego komputera</text><rect x="262" y="110" width="130" height="70" rx="10" fill="#ffffff" stroke="#cfcbdb" stroke-width="1.5" stroke-dasharray="6 4"/><text x="327.0" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Cloudflare</text><text x="327.0" y="154" text-anchor="middle" font-size="12.5" fill="#6c6779">Tunnel + Access</text><text x="327.0" y="172" text-anchor="middle" font-size="12.5" fill="#6c6779">(opcjonalnie)</text><rect x="30" y="470" width="210" height="80" rx="10" fill="#ffffff" stroke="#cfcbdb" stroke-width="1.5" stroke-dasharray="6 4"/><text x="135.0" y="497" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Internet</text><text x="135.0" y="519" text-anchor="middle" font-size="12.5" fill="#6c6779">YouTube, SoundCloud, Bandcamp</text><text x="135.0" y="537" text-anchor="middle" font-size="12.5" fill="#6c6779">dodawane po URL, pobierane raz</text><rect x="410" y="30" width="490" height="640" rx="10" fill="#ffffff" stroke="#6a43c2" stroke-width="1.5"/><text x="655" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#6a43c2">Jeden kontener: melomancer</text><rect x="440" y="70" width="430" height="150" rx="10" fill="#efe9fb" stroke="#6a43c2" stroke-width="1.5"/><text x="655.0" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">FastAPI</text><text x="655.0" y="163" text-anchor="middle" font-size="12.5" fill="#6c6779">logowanie · biblioteka · playlisty · odtwarzacz · odtwarzanie lokalne</text><rect x="440" y="260" width="210" height="75" rx="10" fill="#f6f5f9" stroke="#cfcbdb" stroke-width="1.5"/><text x="545.0" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Downloader</text><text x="545.0" y="316" text-anchor="middle" font-size="12.5" fill="#6c6779">yt-dlp + ffmpeg, limity</text><rect x="440" y="355" width="210" height="75" rx="10" fill="#f6f5f9" stroke="#cfcbdb" stroke-width="1.5"/><text x="545.0" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Pomiar głośności</text><text x="545.0" y="410" text-anchor="middle" font-size="12.5" fill="#6c6779">ffmpeg: głośność i cisza</text><rect x="670" y="260" width="200" height="170" rx="10" fill="#efe9fb" stroke="#6a43c2" stroke-width="1.5"/><text x="770.0" y="323" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">BotManager</text><text x="770.0" y="345" text-anchor="middle" font-size="12.5" fill="#6c6779">jeden GuildPlayer na serwer</text><text x="770.0" y="363" text-anchor="middle" font-size="12.5" fill="#6c6779">Mikser: warstwy, przejścia,</text><text x="770.0" y="381" text-anchor="middle" font-size="12.5" fill="#6c6779">wzmocnienie głośności, glide</text><rect x="440" y="480" width="210" height="90" rx="10" fill="#e6f4ec" stroke="#2f855a" stroke-width="1.5"/><text x="545.0" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">SQLite</text><text x="545.0" y="534" text-anchor="middle" font-size="12.5" fill="#6c6779">/data/melomancer.db</text><text x="545.0" y="552" text-anchor="middle" font-size="12.5" fill="#6c6779">użytkownicy, utwory, playlisty</text><rect x="670" y="480" width="200" height="90" rx="10" fill="#e6f4ec" stroke="#2f855a" stroke-width="1.5"/><text x="770.0" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Pliki muzyczne</text><text x="770.0" y="534" text-anchor="middle" font-size="12.5" fill="#6c6779">/data/music/&lt;id&gt;.&lt;ext&gt;</text><text x="770.0" y="552" text-anchor="middle" font-size="12.5" fill="#6c6779">jedna wspólna biblioteka</text><text x="655" y="652" text-anchor="middle" font-size="12" font-weight="400" fill="#6c6779">jeden proces Pythona, jedna pętla asyncio</text><rect x="950" y="260" width="220" height="170" rx="10" fill="#eef0ff" stroke="#5865f2" stroke-width="1.5"/><text x="1060.0" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#3a45c4">Discord</text><text x="1060.0" y="354" text-anchor="middle" font-size="12.5" fill="#6c6779">gateway + głos (UDP)</text><text x="1060.0" y="372" text-anchor="middle" font-size="12.5" fill="#6c6779">szyfrowanie end-to-end (DAVE)</text><path d="M225 145 L262 145" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#head)"/><path d="M392 145 L440 145" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#head)" marker-start="url(#head-rev)"/><text x="327" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">HTTPS</text><path d="M770 220 L770 260" fill="none" stroke="#6a43c2" stroke-width="2" marker-end="url(#head)"/><text x="780" y="245" text-anchor="start" font-size="12" fill="#6a43c2" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4">graj, głośność, ...</text><path d="M660 220 L660 525 L650 525" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#head)"/><path d="M545 430 L545 480" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#head)"/><text x="553" y="462" text-anchor="start" font-size="12" fill="#2f855a" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4">mierzy</text><path d="M870 345 L950 345" fill="none" stroke="#6a43c2" stroke-width="2" marker-end="url(#head)"/><text x="910" y="336" text-anchor="middle" font-size="12" fill="#6a43c2" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4">głos (Opus)</text><path d="M240 510 L425 510 L425 298 L440 298" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#head)"/><text x="332" y="502" text-anchor="middle" font-size="12" fill="#2b6cb0" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4">yt-dlp</text><path d="M770 570 L770 625 L330 625 L330 370 L225 370" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#head)"/><text x="550" y="617" text-anchor="middle" font-size="12" fill="#2b6cb0" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4">strumień audio (Odtwarzaj tutaj)</text></svg>
