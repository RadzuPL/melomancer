<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="head-rev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect x="250" y="25" width="700" height="105" rx="10" fill="#e6f4ff" stroke="#1668dc" stroke-width="1.5"/><text x="600.0" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#1668dc">The server decides what plays</text><text x="600.0" y="78" text-anchor="middle" font-size="12.5" fill="#6c6779">playlist, tag selection or one track  →</text><text x="600.0" y="96" text-anchor="middle" font-size="12.5" fill="#6c6779">queue with where each track starts and ends and its loudness gain (app/playback.py)</text><text x="600.0" y="114" text-anchor="middle" font-size="12.5" fill="#6c6779">Settings tab: cross-fade, volume glide, loudness, silence</text><path d="M420 130 L420 170 L300 170 L300 195" fill="none" stroke="#1668dc" stroke-width="2" marker-end="url(#head)"/><path d="M780 130 L780 170 L900 170 L900 195" fill="none" stroke="#1668dc" stroke-width="2" marker-end="url(#head)"/><rect x="40" y="195" width="520" height="425" rx="10" fill="none" stroke="#5865f2" stroke-width="1.5" stroke-dasharray="6 4"/><text x="300" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#3a45c4">On Discord (the bot)</text><rect x="640" y="195" width="520" height="425" rx="10" fill="none" stroke="#08979c" stroke-width="1.5" stroke-dasharray="6 4"/><text x="900" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#08979c">Here (the browser)</text><text x="600" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#6c6779">either / or</text><rect x="70" y="245" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Music files on the server</text><text x="300.0" y="293" text-anchor="middle" font-size="12.5" fill="#6c6779">/data/music</text><rect x="70" y="335" width="460" height="70" rx="10" fill="#eef0ff" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Layers: ffmpeg decodes ahead</text><text x="300.0" y="379" text-anchor="middle" font-size="12.5" fill="#6c6779">one thread per layer, so the 20 ms audio</text><text x="300.0" y="397" text-anchor="middle" font-size="12.5" fill="#6c6779">thread never waits for a pipe</text><rect x="70" y="435" width="460" height="75" rx="10" fill="#eef0ff" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Mixer</text><text x="300.0" y="482" text-anchor="middle" font-size="12.5" fill="#6c6779">equal-power cross-fade, loudness gain,</text><text x="300.0" y="500" text-anchor="middle" font-size="12.5" fill="#6c6779">volume that glides instead of jumping</text><rect x="70" y="540" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Opus → Discord voice channel</text><text x="300.0" y="588" text-anchor="middle" font-size="12.5" fill="#6c6779">heard by everyone in the channel</text><path d="M300 305 L300 335" fill="none" stroke="#5865f2" stroke-width="2" marker-end="url(#head)"/><path d="M300 405 L300 435" fill="none" stroke="#5865f2" stroke-width="2" marker-end="url(#head)"/><path d="M300 510 L300 540" fill="none" stroke="#5865f2" stroke-width="2" marker-end="url(#head)"/><rect x="670" y="245" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#08979c" stroke-width="1.5"/><text x="900.0" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Music files on the server</text><text x="900.0" y="293" text-anchor="middle" font-size="12.5" fill="#6c6779">GET /api/tracks/{id}/stream</text><rect x="670" y="335" width="460" height="70" rx="10" fill="#e6fffb" stroke="#08979c" stroke-width="1.5"/><text x="900.0" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">&lt;audio&gt; elements</text><text x="900.0" y="379" text-anchor="middle" font-size="12.5" fill="#6c6779">the current track and the next one,</text><text x="900.0" y="397" text-anchor="middle" font-size="12.5" fill="#6c6779">prepared before the current ends</text><rect x="670" y="435" width="460" height="75" rx="10" fill="#e6fffb" stroke="#08979c" stroke-width="1.5"/><text x="900.0" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Web Audio graph</text><text x="900.0" y="482" text-anchor="middle" font-size="12.5" fill="#6c6779">track gain → fade envelope → master volume</text><text x="900.0" y="500" text-anchor="middle" font-size="12.5" fill="#6c6779">same curves and settings as the mixer</text><rect x="670" y="540" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#08979c" stroke-width="1.5"/><text x="900.0" y="557" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Speakers of this computer</text><text x="900.0" y="579" text-anchor="middle" font-size="12.5" fill="#6c6779">Discord is skipped; stays on while you</text><text x="900.0" y="597" text-anchor="middle" font-size="12.5" fill="#6c6779">switch tabs, stops on reload</text><path d="M900 305 L900 335" fill="none" stroke="#08979c" stroke-width="2" marker-end="url(#head)"/><path d="M900 405 L900 435" fill="none" stroke="#08979c" stroke-width="2" marker-end="url(#head)"/><path d="M900 510 L900 540" fill="none" stroke="#08979c" stroke-width="2" marker-end="url(#head)"/></svg>
