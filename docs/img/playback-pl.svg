<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="head-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect x="250" y="25" width="700" height="105" rx="10" fill="#efe9fb" stroke="#6a43c2" stroke-width="1.5"/><text x="600.0" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#6a43c2">Serwer decyduje, co gra</text><text x="600.0" y="78" text-anchor="middle" font-size="12.5" fill="#6c6779">playlista, wybór tagów albo jeden utwór  →</text><text x="600.0" y="96" text-anchor="middle" font-size="12.5" fill="#6c6779">kolejka z miejscem startu i końca każdego utworu i jego wzmocnieniem głośności (app/playback.py)</text><text x="600.0" y="114" text-anchor="middle" font-size="12.5" fill="#6c6779">Zakładka Ustawienia: przejście, płynność głośności, głośność, cisza</text><path d="M420 130 L420 170 L300 170 L300 195" fill="none" stroke="#6a43c2" stroke-width="2" marker-end="url(#head)"/><path d="M780 130 L780 170 L900 170 L900 195" fill="none" stroke="#6a43c2" stroke-width="2" marker-end="url(#head)"/><rect x="40" y="195" width="520" height="425" rx="10" fill="none" stroke="#5865f2" stroke-width="1.5" stroke-dasharray="6 4"/><text x="300" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#3a45c4">Na Discordzie (bot)</text><rect x="640" y="195" width="520" height="425" rx="10" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="900" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">Tutaj (przeglądarka)</text><text x="600" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#6c6779">albo / albo</text><rect x="70" y="245" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Pliki muzyczne na serwerze</text><text x="300.0" y="293" text-anchor="middle" font-size="12.5" fill="#6c6779">/data/music</text><rect x="70" y="335" width="460" height="70" rx="10" fill="#eef0ff" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Warstwy: ffmpeg dekoduje z wyprzedzeniem</text><text x="300.0" y="379" text-anchor="middle" font-size="12.5" fill="#6c6779">jeden wątek na warstwę, więc wątek audio</text><text x="300.0" y="397" text-anchor="middle" font-size="12.5" fill="#6c6779">co 20 ms nigdy nie czeka na pipe</text><rect x="70" y="435" width="460" height="75" rx="10" fill="#eef0ff" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Mikser</text><text x="300.0" y="482" text-anchor="middle" font-size="12.5" fill="#6c6779">przejście equal-power, wzmocnienie głośności,</text><text x="300.0" y="500" text-anchor="middle" font-size="12.5" fill="#6c6779">głośność, która płynie zamiast skakać</text><rect x="70" y="540" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#5865f2" stroke-width="1.5"/><text x="300.0" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Opus → kanał głosowy Discorda</text><text x="300.0" y="588" text-anchor="middle" font-size="12.5" fill="#6c6779">słyszą wszyscy na kanale</text><path d="M300 305 L300 335" fill="none" stroke="#5865f2" stroke-width="2" marker-end="url(#head)"/><path d="M300 405 L300 435" fill="none" stroke="#5865f2" stroke-width="2" marker-end="url(#head)"/><path d="M300 510 L300 540" fill="none" stroke="#5865f2" stroke-width="2" marker-end="url(#head)"/><rect x="670" y="245" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#2b6cb0" stroke-width="1.5"/><text x="900.0" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Pliki muzyczne na serwerze</text><text x="900.0" y="293" text-anchor="middle" font-size="12.5" fill="#6c6779">GET /api/tracks/{id}/stream</text><rect x="670" y="335" width="460" height="70" rx="10" fill="#e8f1fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="900.0" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Elementy &lt;audio&gt;</text><text x="900.0" y="379" text-anchor="middle" font-size="12.5" fill="#6c6779">bieżący utwór i następny,</text><text x="900.0" y="397" text-anchor="middle" font-size="12.5" fill="#6c6779">przygotowany, zanim bieżący się skończy</text><rect x="670" y="435" width="460" height="75" rx="10" fill="#e8f1fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="900.0" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Graf Web Audio</text><text x="900.0" y="482" text-anchor="middle" font-size="12.5" fill="#6c6779">wzmocnienie utworu → obwiednia przejścia → głośność</text><text x="900.0" y="500" text-anchor="middle" font-size="12.5" fill="#6c6779">te same krzywe i ustawienia co w mikserze</text><rect x="670" y="540" width="460" height="60" rx="10" fill="#f6f5f9" stroke="#2b6cb0" stroke-width="1.5"/><text x="900.0" y="557" text-anchor="middle" font-size="15" font-weight="700" fill="#25222f">Głośniki tego komputera</text><text x="900.0" y="579" text-anchor="middle" font-size="12.5" fill="#6c6779">Discord jest pomijany; gra dalej przy zmianie</text><text x="900.0" y="597" text-anchor="middle" font-size="12.5" fill="#6c6779">kart, kończy się po odświeżeniu</text><path d="M900 305 L900 335" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#head)"/><path d="M900 405 L900 435" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#head)"/><path d="M900 510 L900 540" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#head)"/></svg>
