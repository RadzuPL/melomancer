<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="head-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect x="250" y="25" width="700" height="105" rx="10" fill="#241c3d" stroke="#a78bfa" stroke-width="1.5"/><text x="600.0" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">The server decides what plays</text><text x="600.0" y="78" text-anchor="middle" font-size="12.5" fill="#9198a1">playlist, tag selection or one track  →</text><text x="600.0" y="96" text-anchor="middle" font-size="12.5" fill="#9198a1">queue with where each track starts and ends and its loudness gain (app/playback.py)</text><text x="600.0" y="114" text-anchor="middle" font-size="12.5" fill="#9198a1">Settings tab: cross-fade, volume glide, loudness, silence</text><path d="M420 130 L420 170 L300 170 L300 195" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#head)"/><path d="M780 130 L780 170 L900 170 L900 195" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#head)"/><rect x="40" y="195" width="520" height="425" rx="10" fill="none" stroke="#8b93ff" stroke-width="1.5" stroke-dasharray="6 4"/><text x="300" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#aab0ff">On Discord (the bot)</text><rect x="640" y="195" width="520" height="425" rx="10" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 4"/><text x="900" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#58a6ff">Here (the browser)</text><text x="600" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#9198a1">either / or</text><rect x="70" y="245" width="460" height="60" rx="10" fill="#151b23" stroke="#8b93ff" stroke-width="1.5"/><text x="300.0" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Music files on the server</text><text x="300.0" y="293" text-anchor="middle" font-size="12.5" fill="#9198a1">/data/music</text><rect x="70" y="335" width="460" height="70" rx="10" fill="#1a1e3d" stroke="#8b93ff" stroke-width="1.5"/><text x="300.0" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Layers: ffmpeg decodes ahead</text><text x="300.0" y="379" text-anchor="middle" font-size="12.5" fill="#9198a1">one thread per layer, so the 20 ms audio</text><text x="300.0" y="397" text-anchor="middle" font-size="12.5" fill="#9198a1">thread never waits for a pipe</text><rect x="70" y="435" width="460" height="75" rx="10" fill="#1a1e3d" stroke="#8b93ff" stroke-width="1.5"/><text x="300.0" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Mixer</text><text x="300.0" y="482" text-anchor="middle" font-size="12.5" fill="#9198a1">equal-power cross-fade, loudness gain,</text><text x="300.0" y="500" text-anchor="middle" font-size="12.5" fill="#9198a1">volume that glides instead of jumping</text><rect x="70" y="540" width="460" height="60" rx="10" fill="#151b23" stroke="#8b93ff" stroke-width="1.5"/><text x="300.0" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Opus → Discord voice channel</text><text x="300.0" y="588" text-anchor="middle" font-size="12.5" fill="#9198a1">heard by everyone in the channel</text><path d="M300 305 L300 335" fill="none" stroke="#8b93ff" stroke-width="2" marker-end="url(#head)"/><path d="M300 405 L300 435" fill="none" stroke="#8b93ff" stroke-width="2" marker-end="url(#head)"/><path d="M300 510 L300 540" fill="none" stroke="#8b93ff" stroke-width="2" marker-end="url(#head)"/><rect x="670" y="245" width="460" height="60" rx="10" fill="#151b23" stroke="#58a6ff" stroke-width="1.5"/><text x="900.0" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Music files on the server</text><text x="900.0" y="293" text-anchor="middle" font-size="12.5" fill="#9198a1">GET /api/tracks/{id}/stream</text><rect x="670" y="335" width="460" height="70" rx="10" fill="#0f2236" stroke="#58a6ff" stroke-width="1.5"/><text x="900.0" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">&lt;audio&gt; elements</text><text x="900.0" y="379" text-anchor="middle" font-size="12.5" fill="#9198a1">the current track and the next one,</text><text x="900.0" y="397" text-anchor="middle" font-size="12.5" fill="#9198a1">prepared before the current ends</text><rect x="670" y="435" width="460" height="75" rx="10" fill="#0f2236" stroke="#58a6ff" stroke-width="1.5"/><text x="900.0" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Web Audio graph</text><text x="900.0" y="482" text-anchor="middle" font-size="12.5" fill="#9198a1">track gain → fade envelope → master volume</text><text x="900.0" y="500" text-anchor="middle" font-size="12.5" fill="#9198a1">same curves and settings as the mixer</text><rect x="670" y="540" width="460" height="60" rx="10" fill="#151b23" stroke="#58a6ff" stroke-width="1.5"/><text x="900.0" y="557" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Speakers of this computer</text><text x="900.0" y="579" text-anchor="middle" font-size="12.5" fill="#9198a1">Discord is skipped; stays on while you</text><text x="900.0" y="597" text-anchor="middle" font-size="12.5" fill="#9198a1">switch tabs, stops on reload</text><path d="M900 305 L900 335" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#head)"/><path d="M900 405 L900 435" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#head)"/><path d="M900 510 L900 540" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#head)"/></svg>
