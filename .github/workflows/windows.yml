name: Windows package (experimental)

# Builds the Windows package and tests the code on Windows. It publishes nothing: the zip is an artifact of the run.
on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "requirements*.txt"
      - "scripts/windows/**"
      - "scripts/next_version.sh"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version script reads the tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Download ffmpeg, ffprobe and deno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/windows/build_package.py tools build/bin

      - name: Put the tools on the PATH
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/build/bin" >> "$GITHUB_PATH"

      - name: Install the requirements and the test tools
        run: python -m pip install -r requirements-dev.txt

      # The same tests as in the Linux image, now on Windows.
      - name: Run the tests
        shell: bash
        run: python -m pytest -p no:cacheprovider --tb=short -rf 2>&1 | tee pytest.log

      - name: Show a failure as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          lines = open("pytest.log", encoding="utf-8", errors="replace").read().splitlines() if os.path.exists("pytest.log") else ["no pytest.log"]
          lines = lines[-150:]
          chunks = ["\n".join(lines[i:i + 15]) for i in range(0, len(lines), 15)][-10:]
          for chunk in chunks:
              chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest on Windows::{chunk}")
          PY

      - name: Work out the version
        if: ${{ !cancelled() }}
        id: version
        shell: bash
        run: |
          version=$(bash scripts/next_version.sh)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build the package
        if: ${{ !cancelled() }}
        run: python scripts/windows/build_package.py package --version "${{ steps.version.outputs.value }}" --tools build/bin --out dist

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Melomancer-win64-${{ steps.version.outputs.value }}
          path: dist/*.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Start the package and check it
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/windows/smoke_test.py "dist/Melomancer-win64-${{ steps.version.outputs.value }}.zip" "${{ steps.version.outputs.value }}" 2>&1 | tee smoke.log

      # The job log is not always reachable from outside GitHub, annotations are.
      - name: Show a smoke test failure as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          lines = open("smoke.log", encoding="utf-8", errors="replace").read().splitlines() if os.path.exists("smoke.log") else ["no smoke.log"]
          lines = lines[-150:]
          chunks = ["\n".join(lines[i:i + 15]) for i in range(0, len(lines), 15)][-10:]
          for chunk in chunks:
              chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Windows package smoke test::{chunk}")
          PY

      - name: Show what the smoke test checked
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          lines = [l for l in open("smoke.log", encoding="utf-8", errors="replace").read().splitlines()
                   if l.startswith(("ok   ", "python ", "discord ", "yt-dlp ", "opus ", "ffmpeg version", "ffprobe version", "deno ", "package:"))]
          text = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Windows package smoke test passed::{text}")
          PY
