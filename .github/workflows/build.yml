name: Test, build and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild: fresh base image, ffmpeg and the newest yt-dlp. Does not create a release.
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Tests run inside the image built from the Dockerfile: same Python, ffmpeg and libraries as production,
      # and no dependence on what the runner image happens to ship.
      - uses: docker/setup-buildx-action@v3

      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: melomancer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the panel scripts
        run: |
          node --check app/static/app.js
          node --check app/static/i18n.js
          node scripts/check_i18n.js

      - name: Run the tests
        shell: bash
        run: docker run --rm --entrypoint python melomancer:test -m pytest -p no:cacheprovider --tb=short -rf 2>&1 | tee pytest.log

      # The job log is not always reachable from outside GitHub, annotations are: show the tail of a failed run there.
      - name: Show the failure as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          lines = open("pytest.log").read().splitlines() if os.path.exists("pytest.log") else ["no pytest.log"]
          lines = lines[-150:]
          chunks = ["\n".join(lines[i:i + 15]) for i in range(0, len(lines), 15)][-10:]
          for chunk in chunks:
              chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest::{chunk}")
          PY

  release:
    needs: test
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then export NO_BUMP=1; fi
          version=$(bash scripts/next_version.sh)
          echo "Version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local Docker daemon and test the real image before anything is published.
      - name: Build the image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: melomancer:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            PIP_CACHE_BUST=${{ steps.version.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: bash scripts/smoke_test.sh melomancer:ci

      - name: Publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/radzupl/melomancer:latest
            ghcr.io/radzupl/melomancer:${{ steps.version.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            PIP_CACHE_BUST=${{ steps.version.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag is created only after the image was pushed, so a failed build does not use up a version number.
      - name: Tag and publish the release
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists, nothing to publish."
          else
            gh release create "v${version}" --target "$GITHUB_SHA" --title "v${version}" --generate-notes
          fi
