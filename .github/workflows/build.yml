name: Test, build and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild: fresh base image, ffmpeg and the newest yt-dlp. It is a release of its own (middle number up).
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Tests run inside the image built from the Dockerfile: same Python, ffmpeg and libraries as production,
      # and no dependence on what the runner image happens to ship.
      - uses: docker/setup-buildx-action@v3

      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: melomancer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the panel scripts
        run: |
          node --check app/static/app.js
          node --check app/static/i18n.js
          node scripts/check_i18n.js

      - name: Run the tests
        shell: bash
        run: docker run --rm --entrypoint python melomancer:test -m pytest -p no:cacheprovider --tb=short -rf 2>&1 | tee pytest.log

      # The job log is not always reachable from outside GitHub, annotations are: show the tail of a failed run there.
      - name: Show the failure as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          lines = open("pytest.log").read().splitlines() if os.path.exists("pytest.log") else ["no pytest.log"]
          lines = lines[-150:]
          chunks = ["\n".join(lines[i:i + 15]) for i in range(0, len(lines), 15)][-10:]
          for chunk in chunks:
              chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest::{chunk}")
          PY

  # What the text of the release would say, for a look before merging (the history is needed, so a full checkout).
  notes-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preview the release notes
        run: |
          prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          since=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n 6p)
          version=$(bash scripts/next_version.sh)
          {
            echo "## Release notes preview: a push to main"
            python3 scripts/release_notes.py --mode commit --version "$version" --prev "$prev"
            echo
            echo "## Release notes preview: the Monday rebuild (since $since)"
            python3 scripts/release_notes.py --mode weekly --version "$version" --prev "$prev" --since-tag "$since"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: test
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then export FORCE_MINOR=1; fi
          version=$(bash scripts/next_version.sh)
          echo "Version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local Docker daemon and test the real image before anything is published.
      - name: Build the image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: melomancer:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            PIP_CACHE_BUST=${{ steps.version.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: bash scripts/smoke_test.sh melomancer:ci

      - name: Publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/radzupl/melomancer:latest
            ghcr.io/radzupl/melomancer:${{ steps.version.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            PIP_CACHE_BUST=${{ steps.version.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What the release says: the commit messages since the previous release (a push) or since the previous Monday
      # rebuild (the schedule), see scripts/release_notes.py. A failure here must not stop the release: GitHub's own
      # notes are used then.
      - name: Write the release notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "v${version}" | head -n1 || true)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft | not) | select(.name | test("weekly rebuild"))][0].tag_name // empty' || true)
            python3 scripts/release_notes.py --mode weekly --version "$version" --prev "$prev" ${since:+--since-tag "$since"} > release-notes.tmp
          else
            python3 scripts/release_notes.py --mode commit --version "$version" --prev "$prev" > release-notes.tmp
          fi
          mv release-notes.tmp release-notes.md
          cat release-notes.md

      # The tag is created only after the image was pushed, so a failed build does not use up a version number.
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists, nothing to publish."
          else
            if [ -s release-notes.md ]; then
              notes=(--notes-file release-notes.md)
            elif [ "${{ github.event_name }}" = "schedule" ]; then
              notes=(--notes "Scheduled rebuild: fresh base image, ffmpeg and yt-dlp. No code changes.")
            else
              notes=(--generate-notes)
            fi
            if [ "${{ github.event_name }}" = "schedule" ]; then
              title="v${version} (weekly rebuild)"
            else
              title="v${version}"
            fi
            gh release create "v${version}" --target "$GITHUB_SHA" --title "$title" "${notes[@]}"
          fi
