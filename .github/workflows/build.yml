name: Test, build and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild: fresh base image, ffmpeg and the newest yt-dlp. Does not create a release.
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Make sure ffmpeg and ffprobe are present
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n1

      - run: pip install -r requirements-dev.txt

      - name: Check the panel scripts
        run: |
          node --check app/static/app.js
          node --check app/static/i18n.js
          node scripts/check_i18n.js

      - run: python -m pytest

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then export NO_BUMP=1; fi
          version=$(bash scripts/next_version.sh)
          echo "Version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/radzupl/melomancer:latest
            ghcr.io/radzupl/melomancer:${{ steps.version.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            PIP_CACHE_BUST=${{ steps.version.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag is created only after the image was pushed, so a failed build does not use up a version number.
      - name: Tag and publish the release
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists, nothing to publish."
          else
            gh release create "v${version}" --target "$GITHUB_SHA" --title "v${version}" --generate-notes
          fi
